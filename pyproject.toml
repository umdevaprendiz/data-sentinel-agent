[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sentinel"
version = "0.1.0"
description = "Agente autônomo que investiga anomalias em métricas de negócio."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "langgraph>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
include = ["sentinel*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm and not slow'"
markers = [
    "llm: usa um modelo real no Ollama (não roda por padrão)",
    "slow: leva mais de ~20 s (ex.: 200 sementes); rode com `pytest -m slow`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

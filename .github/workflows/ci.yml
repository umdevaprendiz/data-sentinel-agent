name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor permissão possível: o CI só lê o código.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  # Testes contra um Postgres com pgvector descartável. Sem senha real: o contêiner só aceita
  # conexões locais do próprio job. Nunca ponha aqui o DSN de um banco de verdade.
  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MEMORY_DSN: postgresql://postgres@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # O código 5 do pytest significa "nenhum teste coletado" (ainda não há testes `pg`).
      - run: pytest -m pg || [ $? -eq 5 ]
